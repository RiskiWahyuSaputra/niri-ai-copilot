[package]
name = "niri-ai-copilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Real-time interview assistant floating widget for Arch Linux + Niri (Wayland)"
license = "MIT"
repository = "https://github.com/RiskiWahyuSaputra/niri-ai-copilot"
keywords = ["niri", "wayland", "gtk4", "interview", "whisper"]
categories = ["gui", "multimedia::audio"]

[features]
default = []
# Overlay layer-shell (butuh paket gtk4-layer-shell + build dengan --features layer-shell)
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
gtk4 = "0.11"
gtk4-layer-shell = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "niri-ai-copilot"
path = "src/main.rs"
